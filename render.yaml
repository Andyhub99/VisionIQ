services:
  - type: web
    name: visioniq
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visioniq-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: MODEL_PATH
        value: ml/weights/best.pt
      - key: CONF_THRESHOLD
        value: "0.25"

databases:
  - name: visioniq-db
    plan: free
    region: singapore
    databaseName: visioniq
    user: visioniq
